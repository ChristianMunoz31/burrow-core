name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Burrow is local-first: features that need an account, a hosted service or sending data
        off your computer are unlikely to fit.
