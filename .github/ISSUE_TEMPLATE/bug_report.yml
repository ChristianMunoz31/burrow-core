name: Bug report
description: Something in Burrow is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste your data, journal text, transactions or screenshots that show them.
        Describe what happened instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Burrow version
      description: The version field in package.json, or the release you downloaded.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Docker]
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: RAM
      description: For example 8 GB. Helps with Javi slowness reports.
  - type: input
    id: model
    attributes:
      label: Ollama model
      description: For example qwen2.5:3b. Leave empty if Javi is not involved.
