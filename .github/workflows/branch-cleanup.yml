name: Branch cleanup

# Weekly: deletes merged branches that "Automatically delete head branches" missed (for example bot
# merges). Rules live in scripts/ci/cleanupBranches.js: never main, protected or release-please--*
# branches; never a branch with an open PR; only a branch whose merged PR head equals the branch tip
# and was merged more than 2 days ago. Scheduled runs delete for real; a manual run defaults to a dry run.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would be deleted
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node scripts/ci/cleanupBranches.js
