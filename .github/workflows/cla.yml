# Contributor License Agreement check for the public core repository (docs/adr/0001-open-core-split.md decision 9,
# 3.14). The CLA text is docs/CLA.md. Inactive until the owner sets the repository variable BURROW_PUBLIC_CORE to
# true on the public repo (docs/PUBLISHING_CORE.md); the private repo never runs it. Signatures are stored in the
# cla-signatures branch of the public repo. The job never checks out or runs pull request code.
name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  cla:
    if: >-
      vars.BURROW_PUBLIC_CORE == 'true' && (
        github.event_name == 'pull_request_target' ||
        (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/docs/CLA.md
          branch: cla-signatures
          allowlist: ChristianMunoz31,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
